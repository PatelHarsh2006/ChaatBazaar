<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<body>

      <a href="cart.html" class="nav-link active">Cart (<span id="cart-count">0</span>)</a>
    </nav>

</header>

<section class="cart-page-wrapper">
  <div class="container cart-page-container">
    <div id="cart-header">
      Your Cart
    </div>
    <div id="cart-items" tabindex="0" aria-live="polite" aria-relevant="additions removals">
      <!-- Cart items injected here -->
    </div>
    <div id="cart-footer">
      <span id="cart-total">Total: ₹0</span>
      <button id="checkout-btn" disabled onclick="checkout()">Checkout</button>
    </div>
  </div>
</section>
