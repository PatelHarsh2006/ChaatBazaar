<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — ChaatBazar</title>

  <script>
    (function() {
      var saved = localStorage.getItem('chaatTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-inner container" role="banner">
    <a href="index.html" class="logo" aria-label="ChaatBazar Home">ChaatBazar 🍴</a>
    <nav role="navigation" aria-label="Primary Navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="cart.html" class="nav-link active">Cart</a>
      <a href="index.html#about" class="nav-link">About</a>
      <a href="orders.html" class="nav-link">Orders</a>
      <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle theme">
        <span id="theme-icon">☀️</span>
      </button>
    </nav>
  </div>
</header>

<section class="cart-page container">
  <h1>Your Cart</h1>
  <div id="cart-items">
    <!-- Cart items injected by JS -->
  </div>
  <p id="total-price" style="text-align:center;font-size:1.3rem;font-weight:700;color:var(--accent-primary);margin:2rem 0;"></p>
  <div style="text-align:center;">
    <button onclick="window.checkout()" class="btn-primary" style="font-size:1.1rem;">Checkout</button>
  </div>
</section>

<footer>
  <p>&copy; 2026 ChaatBazar. All rights reserved.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
