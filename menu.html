<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - ChaatBazar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-inner container" role="banner">
    <a href="index.html" class="logo" aria-label="ChaatBazar Home">ChaatBazar 🍴</a>
    <nav role="navigation" aria-label="Primary Navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link active">Menu</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="cart.html" class="nav-link" id="cart-open-btn" aria-label="Open Cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </div>
</header>

<main class="container">
  <section id="menu" class="menu" style="padding: 4rem 1rem;">
    <h1 class="section-title">Explore Our Menu</h1>
    <div class="filter-buttons" role="toolbar" aria-label="Filter menu categories">
      <button class="filter-btn active" data-filter="All" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="Snacks" aria-pressed="false">Snacks</button>
      <button class="filter-btn" data-filter="Chaat" aria-pressed="false">Chaat</button>
      <button class="filter-btn" data-filter="Beverages" aria-pressed="false">Beverages</button>
    </div>
    <div class="cards" id="menu-cards" aria-live="polite">
      <!-- Menu cards injected here -->
    </div>
  </section>
</main>

<footer>
  <p>© 2026 ChaatBazar. All rights reserved.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
