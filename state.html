<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChaatBazar | Explore by State</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner container" role="banner">
      <a href="index.html" class="logo" aria-label="Back to home">ChaatBazar 🍴</a>
      <nav role="navigation" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
          <span class="theme-toggle-track">
            <span class="theme-toggle-icon sun-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </span>
            <span class="theme-toggle-icon moon-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
            <span class="theme-toggle-thumb"></span>
          </span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 2rem 1rem 4rem;">
    <section class="state-page-heading">
      <p class="eyebrow">State Spotlight</p>
      <h1 id="state-title">State Delicacies</h1>
      <p id="state-description">Browse regional favourites from this state.</p>
    </section>

    <section class="cards" id="state-items" aria-live="polite"></section>
  </main>

  <script>
    //Dark Mode(kept in sync with js/main.js)
    const themeToggleBtn = document.getElementById("theme-toggle");

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
      }
    });

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
      });
    }
  </script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const stateName = params.get('state') || 'Gujarat';

    function formatPrice(value) {
      return `₹${value}`;
    }

    fetch('items.json')
      .then((res) => {
        if (!res.ok) throw new Error('Unable to load items.json');
        return res.json();
      })
      .then((items) => {
        const filtered = items.filter((item) => item.state === stateName);
        const title = document.getElementById('state-title');
        const description = document.getElementById('state-description');
        const container = document.getElementById('state-items');

        title.textContent = `${stateName} Delicacies`;
        description.textContent = filtered.length
          ? `Discover ${filtered.length} regional favorites from ${stateName}.`
          : `No regional favorites are available for ${stateName} yet.`;

        if (!filtered.length) {
          container.innerHTML = '<p class="empty-state">No items are available for this state yet.</p>';
          return;
        }

        filtered.forEach((item) => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <img src="${item.image}" alt="${item.name}" loading="lazy" />
            <div class="card-content">
              <h3>${item.name}</h3>
              <p>${item.description}</p>
              <p class="price">${formatPrice(item.price)}</p>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch((error) => {
        console.error(error);
        document.getElementById('state-items').innerHTML = '<p class="empty-state">Unable to load regional items right now.</p>';
      });
  </script>
</body>
</html>
