<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ChaatBazar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body data-page-type="login">

<header class="site-header">
  <div class="header-inner container" role="banner"></div>
</header>
  <main class="auth-main" role="main" aria-label="Login form">
    <div class="food-animation-bg" aria-hidden="true">
      <span class="floating-food samosa">🥟</span>
      <span class="floating-food pani-puri">🫓</span>
      <span class="floating-food chaat">🍲</span>
      <span class="floating-food chai">☕</span>
      <span class="floating-food lassi">🥛</span>
    </div>

    <section class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Login to continue your ChaatBazar journey.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="input-group">
            <label for="login-email"><i class="fa-solid fa-envelope"></i>Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required />
            <p id="login-email-error" class="error-message" aria-live="polite"></p>
          </div>

          <div class="input-group">
            <label for="login-password"><i class="fa-solid fa-lock"></i>Password</label>
            <input type="password" id="login-password" placeholder="Minimum 6 characters" minlength="6" autocomplete="current-password" required />
            <p id="login-password-error" class="error-message" aria-live="polite"></p>
          </div>

          <p class="form-message" aria-live="polite"></p>

          <button type="submit" class="auth-btn">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
          </button>
        </form>

        <p class="auth-switch-text">
          New here?
          <a class="auth-link" href="signup.html">Create an account</a>
        </p>

        <p class="auth-footer-note">Fresh flavors. Fast delivery. Happy cravings.</p>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
