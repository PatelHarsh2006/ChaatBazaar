<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites - ChaatBazar</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="favicon.png" type="image/png" />
</head>

<body>
  <header>
    <div class="header-inner container" role="banner">
      <a href="index.html" class="logo" aria-label="ChaatBazar Home">ChaatBazar 🍴</a>
      <nav role="navigation" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <div class="dropdown" tabindex="0" aria-haspopup="true" aria-expanded="false">
          <a href="menu.html" class="dropdown-toggle nav-link">Menu</a>
          <div class="dropdown-menu" role="menu" aria-label="Menu Categories">
            <a href="menu.html" role="menuitem" tabindex="-1" onclick="filterCategory('All')">All</a>
            <a href="menu.html" role="menuitem" tabindex="-1" onclick="filterCategory('Snacks')">Snacks</a>
            <a href="menu.html" role="menuitem" tabindex="-1" onclick="filterCategory('Chaat')">Chaat</a>
            <a href="menu.html" role="menuitem" tabindex="-1" onclick="filterCategory('Beverages')">Beverages</a>
          </div>
        </div>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="favorites.html" class="nav-link active">Favorites (<span id="fav-count">0</span>)</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="cart.html" class="nav-link">Cart</a>
        <div class="search-bar" role="search">
          <input type="search" placeholder="Search menu..." aria-label="Search menu" id="search-input"
            autocomplete="off" />
          <button aria-label="Search" id="search-btn"></button>
          <div class="search-suggestions" id="search-suggestions" style="display: none;"></div>
        </div>
      </nav>
    </div>
  </header>
  <section class="favorites-page container">
    <h1>My Favorites</h1>

    <div class="favorites-container cards" id="favorites-container" aria-live="polite">
      <!-- Favorited items will be rendered here dynamically -->
    </div>
  </section>
  <footer>
    <p>&copy; 2026 ChaatBazar. All rights reserved.</p>
  </footer>
  <script src="js/cart-manager.js"></script>
  <script src="js/recently-viewed.js"></script>
  <script src="js/delivery-tracker.js"></script>
  <script src="js/geolocation.js"></script>
  <script src="js/sanitization.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Dynamically render favorited cards
    document.addEventListener("DOMContentLoaded", () => {
      // Wait for menu database items to load
      const checkMenuDataInterval = setInterval(() => {
        if (typeof menuItems !== 'undefined' && menuItems.length > 0) {
          clearInterval(checkMenuDataInterval);
          renderFavoritesList();
        }
      }, 100);

      function renderFavoritesList() {
        const container = document.getElementById("favorites-container");
        if (!container) return;

        if (typeof FavoritesManager === 'undefined') {
          container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #bf360c; font-weight: 600; margin-top: 2rem;">Favorites Manager not loaded.</p>`;
          return;
        }

        const favItems = FavoritesManager.getItems();
        container.innerHTML = "";

        if (favItems.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; color: #5d4037; margin-top: 3rem; width: 100%;">
              <p style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem;">No Favorites Added Yet ❤️</p>
              <p>Explore our menu and add your favorite street food snacks!</p>
              <a href="menu.html" class="btn-primary" style="display: inline-block; margin-top: 1.5rem; text-decoration: none;">Browse Menu</a>
            </div>
          `;
          return;
        }

        favItems.forEach(item => {
          // Create the standard card
          const card = createCard(item);
          container.appendChild(card);
        });
      }
      
      // Override favorite toggle actions on Favorites page to immediately re-render on removal
      const originalShowToast = window.showToast;
      window.showToast = function(msg) {
        if (originalShowToast) originalShowToast(msg);
        if (msg.includes("Removed") && msg.includes("Favorites")) {
          renderFavoritesList();
        }
      };
    });
  </script>
</body>

</html>
