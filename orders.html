<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ChaatBazar</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.png" type="image/png" />

  <!-- Leaflet CSS (MAP) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>

<header>
  <div class="header-inner container">
    <a href="index.html" class="logo">ChaatBazar 🍴</a>

    <nav>
      <a href="index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="orders.html" class="nav-link active">Orders</a>
      <a href="cart.html" class="nav-link">Cart</a>
    </nav>
  </div>
</header>

<!-- ================= MAP SECTION ================= -->
<section class="container">
  <h2>Live Order Tracking 🚚</h2>

  <div
    id="map"
    style="height: 320px; width: 100%; border-radius: 12px; margin: 15px 0;"
  ></div>
</section>

<!-- ================= ORDERS ================= -->
<section class="orders-page container">
  <h1>My Orders</h1>

  <div class="orders-container" id="orders-container">
    <!-- Orders will be rendered here -->
  </div>
</section>

<footer>
  <p>&copy; 2026 ChaatBazar. All rights reserved.</p>
</footer>

<!-- Leaflet JS (MAP) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Your JS -->
<script src="js/main.js"></script>

<script>
  // ================= MAP TRACKING =================
  function initMapTracking() {
    const mapContainer = document.getElementById("map");
    if (!mapContainer) return;

    // Shop location (Mumbai example)
    const shopLocation = [19.0760, 72.8777];

    const map = L.map("map").setView(shopLocation, 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Shop marker
    L.marker(shopLocation)
      .addTo(map)
      .bindPopup("🍴 ChaatBazar Kitchen")
      .openPopup();

    // Fake delivery person
    let deliveryLocation = [19.0850, 72.8900];

    const deliveryMarker = L.marker(deliveryLocation)
      .addTo(map)
      .bindPopup("🚚 Delivery Partner");

    // Simulated movement
    setInterval(() => {
      deliveryLocation = [
        deliveryLocation[0] + 0.0005,
        deliveryLocation[1] - 0.0005
      ];

      deliveryMarker.setLatLng(deliveryLocation);
    }, 2000);
  }

  // init map after page load
  window.addEventListener("load", initMapTracking);
</script>

</body>
</html>
